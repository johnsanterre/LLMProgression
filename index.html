<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Managing the Context Window — Keynote Deck</title>
<style>
  :root {
    --bg: #0a1429;
    --bg2: #0d1a35;
    --ink: #f3f6fc;
    --muted: #9fb0cc;
    --blue: #2f6fed;
    --orange: #ff7a18;
    --teal: #19c2c2;
    --line: rgba(159,176,204,0.25);

    /* ---- type scale · tuned for Zoom legibility (raised minimums) ---- */
    --fs-kicker: clamp(13px, 1.15vw, 16px);  /* eyebrow labels        */
    --fs-h1:     clamp(30px, 4.2vw, 58px);   /* slide titles, bio name */
    --fs-h2:     clamp(23px, 2.6vw, 36px);   /* section / diagram titles */
    --fs-h3:     clamp(18px, 1.8vw, 25px);   /* card headings          */
    --fs-lead:   clamp(17px, 1.6vw, 23px);   /* captions, leads, key body */
    --fs-body:   clamp(16px, 1.35vw, 20px);  /* card body, dense text  */
    --fs-bullet: clamp(19px, 2.1vw, 29px);   /* summary bullets        */
    --fs-small:  clamp(14px, 1.15vw, 17px);  /* sub-labels, footnotes, links */
    --fs-chrome: 13px;                       /* counter, brand, hints  */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 70% 20%, #102043 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

  .slide {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    padding: 4.5vh 6vw 9vh;
    text-align: center;
    opacity: 0;
    transition: opacity .35s ease;
  }
  .slide.active { display: flex; opacity: 1; }

  .kicker {
    text-transform: uppercase;
    letter-spacing: .28em;
    font-size: var(--fs-kicker);
    color: var(--orange);
    font-weight: 700;
    margin-bottom: 1.6vh;
  }
  .title {
    font-size: var(--fs-h1);
    font-weight: 800;
    line-height: 1.05;
    max-width: none;
    white-space: nowrap;       /* keep titles on one line; JS auto-fits if too wide */
    margin-bottom: 1.4vh;
  }
  .caption {
    color: var(--muted);
    font-size: var(--fs-lead);
    max-width: 60ch;
    line-height: 1.5;
    margin-top: 2.2vh;
  }
  .note {
    color: var(--muted);
    font-size: var(--fs-body);
    max-width: 64ch;
    line-height: 1.5;
    margin-top: 1.6vh;
    opacity: .9;
  }
  .source {
    position: relative; z-index: 10;       /* clickable above the nav zones */
    display: inline-block; margin-top: 1vh; margin-left: .8em; margin-right: .8em;
    color: var(--teal); font-size: var(--fs-small); letter-spacing: .04em;
    text-decoration: none; border-bottom: 1px solid rgba(25,194,194,0.5);
  }
  .source:hover { color: #6fe3e3; border-bottom-color: #6fe3e3; }

  /* ---- architecture diagram ---- */
  .arch {
    width: 94vw; max-width: 1340px;
    display: grid; grid-template-columns: 1.25fr 38px 1.3fr 38px 0.85fr;
    gap: 0; align-items: stretch; text-align: left;
  }
  .arch-col { display: flex; flex-direction: column; justify-content: center; gap: 1.1vh; }
  .arch-group {
    position: relative; border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 1.7vh 0.7vw 1.1vh; display: flex; flex-direction: column; gap: 0.7vh;
  }
  .arch-group .lbl {
    position: absolute; top: -0.85em; left: 10px; background: #0a1730; padding: 0 6px;
    font-size: clamp(11px, .85vw, 12px); letter-spacing: .14em; text-transform: uppercase; font-weight: 800;
  }
  .arch-group.static { border-color: rgba(47,111,237,.6); }  .arch-group.static .lbl { color: #6ea0ff; }
  .arch-group.mem    { border-color: rgba(25,194,194,.6); }  .arch-group.mem .lbl    { color: #5fdede; }
  .arch-group.rag    { border-color: rgba(47,111,237,.6); }  .arch-group.rag .lbl    { color: #6ea0ff; }
  .arch-group.door   { border-color: rgba(25,194,194,.6); }  .arch-group.door .lbl   { color: #5fdede; }
  .arch-group.harness{ border-color: rgba(255,122,24,.6); }  .arch-group.harness .lbl{ color: #ffae6b; }
  .box {
    background: linear-gradient(180deg, rgba(20,38,77,.9), rgba(12,23,48,.9));
    border: 1px solid var(--line); border-radius: 8px; padding: 0.7vh 0.6vw;
    font-size: clamp(12px, 1vw, 15px); font-weight: 600; color: var(--ink); line-height: 1.15;
  }
  .box small { display: block; font-weight: 400; color: var(--muted); font-size: .8em; margin-top: 1px; }
  .box.mini { text-align: center; }
  .hrow { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7vh 0.5vw; }
  .arch-window {
    margin-top: 1.1vh; background: rgba(255,122,24,.14); border: 2px solid var(--orange);
    border-radius: 10px; padding: 1.1vh; text-align: center; font-weight: 800; color: #ffd9b8;
    font-size: clamp(12px, 1.2vw, 17px);
  }
  .arch-window small { display: block; font-weight: 500; color: var(--muted); font-size: .68em; }
  .arch-llm {
    background: linear-gradient(180deg, rgba(47,111,237,.3), rgba(13,26,53,.7)); border: 2px solid var(--blue);
    border-radius: 10px; padding: 1.6vh 0.8vw; text-align: center; font-weight: 800; font-size: clamp(13px, 1.3vw, 18px);
  }
  .arch-llm small { display: block; font-weight: 500; color: var(--muted); font-size: .68em; }
  .box.resp { text-align: center; background: rgba(25,194,194,.14); border-color: var(--teal); font-weight: 700; }
  .arch-arrow { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 26px; }
  .arch-arrow.down { font-size: 20px; }
  .loop { margin-top: 0.8vh; text-align: center; font-size: clamp(12px, 1vw, 13px); color: var(--muted); letter-spacing: .03em; }

  /* ---- bullets summary slide ---- */
  .bullets { list-style: none; text-align: left; max-width: 64ch; margin-top: 3.5vh; display: flex; flex-direction: column; gap: 2.4vh; }
  .bullets li { position: relative; padding-left: 1.7em; font-size: var(--fs-bullet); font-weight: 700; color: var(--ink); line-height: 1.25; }
  .bullets li::before { content: "▹"; position: absolute; left: 0; color: var(--orange); }
  .bullets li small { display: block; color: var(--muted); font-weight: 400; font-size: var(--fs-small); margin-top: .4em; line-height: 1.4; }

  /* ---- two-card case-study slide ---- */
  .cases-lead { margin-top: 1.2vh; font-size: var(--fs-lead); color: var(--muted); max-width: 70ch; }
  .cases { display: flex; gap: 1.6vw; margin-top: 2.4vh; width: 100%; max-width: 1240px; align-items: stretch; }
  .case-card { flex: 1; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.09); border-radius: 14px; padding: 2.4vh 1.4vw; text-align: left; display: flex; flex-direction: column; }
  .case-card .co { font-size: var(--fs-h3); font-weight: 800; color: var(--ink); line-height: 1.15; }
  .case-card .theme { font-size: var(--fs-small); color: var(--orange); font-weight: 700; margin: .45em 0 .9em; line-height: 1.25; }
  .case-card p { font-size: var(--fs-body); color: var(--muted); line-height: 1.45; margin: 0; }

  /* ---- appendix · learn-more links ---- */
  .appendix { display: flex; gap: 1.6vw; margin-top: 2.4vh; width: 100%; max-width: 1280px; align-items: stretch; }
  .appendix-card { flex: 1; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.09); border-radius: 14px; padding: 2.4vh 1.3vw; text-align: left; display: flex; flex-direction: column; }
  .appendix-card h3 { font-size: var(--fs-h3); color: var(--ink); margin-bottom: 1.4vh; line-height: 1.15; }
  .appendix-card ol { list-style: decimal; padding-left: 1.3em; display: flex; flex-direction: column; gap: 1vh; margin: 0; }
  .appendix-card li { font-size: var(--fs-small); line-height: 1.3; color: var(--muted); }
  .appendix-card a { position: relative; z-index: 10; color: var(--teal); text-decoration: none; border-bottom: 1px solid rgba(25,194,194,.35); }
  .appendix-card a:hover { color: #6fe3e3; border-bottom-color: #6fe3e3; }

  /* ---- before/after comparison slide ---- */
  .cmp { display: flex; gap: 2.4vw; margin-top: 3vh; width: 100%; max-width: 1120px; align-items: stretch; }
  .cmp-col { flex: 1; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.09); border-radius: 16px; padding: 3vh 1.8vw; display: flex; flex-direction: column; align-items: center; }
  .cmp-col h3 { margin: 0 0 1.8vh; font-size: var(--fs-h3); font-weight: 800; letter-spacing: .01em; }
  .cmp-col.before h3 { color: var(--muted); }
  .cmp-col.after h3 { color: var(--orange); }
  .cmp-node { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 1vh 1.3vw; font-size: var(--fs-body); color: var(--ink); text-align: center; line-height: 1.2; }
  .cmp-node small { display: block; color: var(--muted); font-size: .82em; margin-top: .25em; }
  .cmp-arrow { color: var(--muted); font-size: 1.3em; margin: .6vh 0; }
  .cmp-row { display: flex; gap: .7vw; flex-wrap: wrap; justify-content: center; }
  .cmp-foot { margin-top: auto; padding-top: 2vh; font-size: var(--fs-small); color: var(--muted); text-align: center; line-height: 1.45; }
  .cmp-note { margin-top: 3vh; max-width: 1000px; text-align: center; font-size: var(--fs-lead); color: var(--ink); line-height: 1.5; }
  .cmp-note em { color: var(--orange); font-style: normal; font-weight: 700; }

  /* ---- parallel sub-agents / A2A slide ---- */
  .agents { display: flex; flex-direction: column; align-items: center; margin-top: 3.5vh; gap: 1.2vh; }
  .agent-row { display: flex; align-items: center; gap: 1vw; flex-wrap: wrap; justify-content: center; }
  .a2a-link { color: var(--orange); font-size: 1.5em; font-weight: 700; line-height: 1; }
  .agents .label { font-size: var(--fs-small); color: var(--muted); margin-top: .4vh; }

  .media { max-width: min(78vw, 1100px); max-height: 62vh; display: flex; }
  .media img {
    max-width: 100%; max-height: 62vh;
    object-fit: contain;
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }

  /* placeholder media */
  .placeholder {
    width: min(70vw, 920px);
    height: 50vh;
    border: 2px dashed var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(47,111,237,.08), rgba(255,122,24,.06));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.4vh; padding: 4vh;
  }
  .placeholder .ph-tag {
    font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--teal); font-weight: 700;
  }
  .placeholder .ph-desc { color: var(--muted); max-width: 52ch; line-height: 1.55; font-size: var(--fs-lead); }

  /* bio slide */
  .bio { display: flex; align-items: center; gap: 5vw; flex-wrap: wrap; justify-content: center; }
  .bio .photo {
    width: 30vh; height: 30vh; min-width: 220px; min-height: 220px;
    border-radius: 50%;
    border: 3px solid var(--orange);
    background: linear-gradient(160deg, #15264d, #0c1730);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; letter-spacing: .12em; text-transform: uppercase;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    overflow: hidden;
  }
  .bio .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 27% 30%; }
  .bio .who { text-align: left; max-width: 34ch; }
  .bio .name { font-size: var(--fs-h1); font-weight: 800; line-height: 1.05; }
  .bio .role { color: var(--orange); font-weight: 700; margin-top: 1vh; font-size: var(--fs-lead); }
  .bio ul { list-style: none; margin-top: 2.4vh; display: flex; flex-direction: column; gap: 1vh; }
  .bio li { color: var(--muted); font-size: var(--fs-lead); padding-left: 1.4em; position: relative; }
  .bio li::before { content: "▹"; color: var(--teal); position: absolute; left: 0; }
  .bio-link { display: inline-block; margin-top: 2.4vh; color: var(--orange); text-decoration: none; font-size: var(--fs-small); font-weight: 600; border-bottom: 1px solid rgba(255,255,255,.18); padding-bottom: 2px; }
  .bio-link:hover { border-bottom-color: var(--orange); }

  /* chrome */
  .counter {
    position: fixed; bottom: 3vh; right: 3vw;
    color: var(--muted); font-size: var(--fs-chrome); letter-spacing: .15em;
    font-variant-numeric: tabular-nums;
  }
  .brand {
    position: fixed; top: 3vh; left: 3vw;
    color: var(--muted); font-size: var(--fs-chrome); letter-spacing: .22em; text-transform: uppercase;
  }
  .dots { position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%); display: flex; gap: 9px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); cursor: pointer; transition: all .2s; }
  .dot.active { background: var(--orange); transform: scale(1.35); }

  .nav-hint { position: fixed; bottom: 3vh; left: 3vw; color: var(--muted); font-size: var(--fs-chrome); opacity: .65; }

  /* click zones */
  .zone { position: fixed; top: 0; bottom: 0; width: 25%; cursor: pointer; z-index: 5; }
  .zone.left { left: 0; }
  .zone.right { right: 0; }
</style>
</head>

  <div class="brand">Managing the Context Window</div>

  <div class="dots" id="dots"></div>

      String(idx+1).padStart(2,"0") + " / " + String(slides.length).padStart(2,"0");

    requestAnimationFrame(fitTitles);
  }

  // Keep every title on a single line: shrink the font only if it would overflow.
  function fitTitles(){
    const active = stage.querySelector(".slide.active");
    if (!active) return;
    const cs = getComputedStyle(active);
    const avail = active.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    active.querySelectorAll(".title").forEach(t => {
      const contentW = t.scrollWidth;
      if (contentW > avail) {
        const base = parseFloat(getComputedStyle(t).fontSize);
        const fitted = Math.max(14, Math.floor(base * (avail / contentW)));
        t.style.fontSize = fitted + "px";
      }
    });
  }

  function go(i){ idx = Math.max(0, Math.min(slides.length-1, i)); render(); }
  function next(){ go(idx+1); }
  function prev(){ go(idx-1); }

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 120);
  });

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { next(); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { prev(); }
    else if (e.key === "Home") { go(0); }
    else if (e.key === "End") { go(slides.length-1); }
  });

  render();
</script>
</body>
</html>
